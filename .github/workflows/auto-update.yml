name: Auto Update Data

# 每 30 分钟自动抓取腾讯文档数据 + DeepSeek 用量，推送到仓库（GitHub Pages 自动重建）
# 全部在线托管：本地无需运行任何脚本
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}  # 支持手动触发
  push:
    branches: [main]  # 人工 push 立即触发数据更新（bot 自提交会跳过，防循环）

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip bot self-trigger (anti-loop)
        run: |
          AUTHOR=$(git log -1 --pretty=format:'%an')
          echo "last author: $AUTHOR"
          if [ "$AUTHOR" = "qiuzhao27-bot" ]; then
            echo "Bot self-commit, skip update to avoid loop"
            exit 78
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch data from Tencent Docs
        env:
          QIUZHAO_OUT_DIR: ${{ github.workspace }}
        run: |
          python fetch_data.py

      - name: Fetch DeepSeek balance
        env:
          QIUZHAO_OUT_DIR: ${{ github.workspace }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_TOTAL_AMOUNT: ${{ secrets.DEEPSEEK_TOTAL_AMOUNT }}
        run: |
          python fetch_deepseek.py

      - name: Fetch mail events (optional, requires secrets)
        env:
          QIUZHAO_OUT_DIR: ${{ github.workspace }}
          MAIL_IMAP_HOST: ${{ secrets.MAIL_IMAP_HOST }}
          MAIL_EMAIL: ${{ secrets.MAIL_EMAIL }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
        run: |
          python read_mail.py || echo "mail fetch skipped (secrets not configured)"

      - name: Fetch OfferShow hot salaries (public API)
        env:
          QIUZHAO_OUT_DIR: ${{ github.workspace }}
        run: |
          python fetch_offershow.py || echo "offershow fetch skipped"

      - name: Commit and push if changed
        run: |
          git config user.name "qiuzhao27-bot"
          git config user.email "qiuzhao27-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes, skip commit"
          else
            git commit -m "chore: auto update data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "Pushed data update"
          fi
